[package]
name = "nomget"
version = "0.1.2"
edition = "2021"
authors = ["KopterBuzz", "Gabor Nemeth"]
description = "Terminal application and API to query NOMNOM manifests, manage BepInEx 5, and install Nuclear Option mods."
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "2.1"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[[bin]]
name = "nomget"
path = "src/main.rs"

[lib]
name = "nomget"
path = "src/lib.rs"
